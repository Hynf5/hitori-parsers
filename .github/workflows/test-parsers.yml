name: Parsers Check

on:
  push:
    branches:
      - hitori-pr
    paths:
      - 'src/main/kotlin/org/koitharu/kotatsu/parsers/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 🌏
        uses: actions/checkout@v5

      - name: Set up Java 🔧
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 📦
        uses: gradle/actions/setup-gradle@v4

      # ===============================
      # 🔥 Compile parsers & save log
      # ===============================
      - name: Compile parsers 🚀
        id: build
        run: |
          set -o pipefail
          ./gradlew compileKotlin --stacktrace 2>&1 | tee build.log

      - name: Set short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:10}" >> $GITHUB_ENV

      # ===============================
      # ❌ Capture Gradle Kotlin errors
      # ===============================
      - name: Capture Gradle Kotlin Errors
        id: gradle_errors
        if: failure()
        run: |
          # Extract file:line:error message from log (Kotlin compiler errors)
          ERRORS=$(grep -E "^[^:]+\.kt:[0-9]+: " build.log || true)
          # Batasi max 1500 karakter agar muat di Discord embed
          ERRORS=$(echo "$ERRORS" | head -c 1500)
          if [ -z "$ERRORS" ]; then
            ERRORS="No specific Kotlin compiler errors found, see full log."
          fi
          echo "ERROR_LOG<<EOF" >> $GITHUB_OUTPUT
          echo "$ERRORS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ===============================
      # ✅ SUCCESS NOTIFICATION
      # ===============================
      - name: Notify Discord (Success) ✅
        if: success()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "✅ Test Parsers Build Success"
          embed-thumbnail-url: "${{ secrets.SUCCESS_THUMBNAIL_URL }}"
          embed-description: |
            > **📁 Repo:** `${{ github.repository }}`
            > **🌿 Branch:** `${{ github.ref_name }}`
            > **🔖 Commit:** [`${{ env.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          embed-color: 3066993
          embed-url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

      # ===============================
      # 2️⃣ EMBED MESSAGE COMMIT
      # ===============================
      - name: Send Commit Message (Embed)
        if: success()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "📝 Commit"
          embed-description: |
            > ${{ github.event.head_commit.message }}
          embed-color: 3066993
          #embed-author-name: "${{ github.actor }}"
          #embed-author-icon-url: "https://github.com/${{ github.actor }}.png"
          embed-footer-icon-url: "${{ secrets.FOOTER_IMG_URL }}"
          embed-footer-text: "${{ env.SHORT_SHA }}"

      # ===============================
      # ❌ ERROR NOTIFICATION
      # ===============================
      - name: Notify Discord (Failure) ⛔
        if: failure()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "❌ Test Parsers Build Failed"
          embed-thumbnail-url: "${{ secrets.EROR_THUMBNAIL_URL }}"
          embed-description: |
            🚨 **Error Summary**
            • Job: `build-and-test`
            • Step: `Compile parsers`
            
            **📝 Commit:**
            > ${{ github.event.head_commit.message }}

            **⚡ Kotlin Compiler Errors:**
            ```
            ${{ steps.gradle_errors.outputs.ERROR_LOG }}
            ```
            
            **🔗 Full Logs:**
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-color: 15158332
          embed-footer-text: ${{ github.actor }} | ${{ env.SHORT_SHA }}
          embed-footer-icon-url: https://github.com/${{ github.actor }}.png
